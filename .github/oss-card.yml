# Settings for the OSS activity card: https://github.com/yamamoto7/oss-activity-card
# Everything is commented out, so the card uses the defaults.
# Full reference: https://github.com/yamamoto7/oss-activity-card/blob/main/examples/oss-card.yml

title: "OSS Contributions"
# since: auto              # or a date like 2024-01-01

groups:
  repos: true            # repo headings with stars; false or auto (only owners with 2+ repos)
  sort: recent           # or count
  max_owners: 5
  max_prs: 2
  max_badges: 12         # owners past max_owners shown as badges in the footer

priority:
  default: 0             # -1 shows only the owners listed below
  owners:
    grafana: 10
    axllent: 9
    detekt: 8

featured:
  - pr: grpc-ecosystem/grpc-gateway#7653
    note: Fixed an issue open since 2018. Generated code failed to compile for optional enum and bytes path params.
  - pr: webpro-nl/knip#2319
    note: Knip reported custom Next.js image loaders as unused, and --fix could delete them. Now they're entry files.

exclude:
  - FAcraftTech
  - kthatoto
  - team-aluminum
  - ukiuki-inkya
  - infratop-revolution
  - litalico-si-2018
  - emmabostian
